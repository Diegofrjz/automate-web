server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # HTML, JS y CSS no tienen hash en el nombre: el navegador debe revalidar
    # siempre (responde 304 si no cambió) para que cada Deploy se vea al instante.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache" always;
    }

    # Imágenes e íconos: cache de 1 día.
    location ~* \.(png|jpg|jpeg|webp|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
